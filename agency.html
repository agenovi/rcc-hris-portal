<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCC Merchandiser Openings</title>
<style>
  :root{--navy:#1E3A5F;--navy-d:#142a45;--ink:#1F2A37;--muted:#6B7785;--line:#E3E8EF;--bg:#F4F6F8;--gold:#c8a86a;
    --green:#1c6b3f;--green-bg:#e8f2eb;--amber:#8a6a14;--amber-bg:#fdf6e3;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{background:var(--bg);color:var(--ink);line-height:1.5;}
  .top{background:linear-gradient(135deg,var(--navy-d),var(--navy));color:#fff;padding:20px 22px;}
  .top h1{font-size:20px;font-weight:800;}
  .top .s{opacity:.8;font-size:13px;margin-top:2px;}
  .wrap{max-width:880px;margin:0 auto;padding:18px 16px 60px;}
  .tabs{display:flex;gap:8px;margin:14px 0;}
  .tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:700;font-size:13.5px;color:var(--navy);cursor:pointer;}
  .tab.sel{background:var(--navy);color:#fff;border-color:var(--navy);}
  .grp{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:16px 0 6px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .card .nm{font-weight:700;color:var(--navy);font-size:15px;}
  .card .loc{font-size:12.5px;color:var(--muted);}
  .chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
  .chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;}
  .chip.open{background:var(--green-bg);color:var(--green);}
  .chip.rev{background:#e7f1f5;color:#2c6e8f;}
  .chip.hir{background:var(--bg);color:var(--muted);}
  .chip.urg{background:#fdecea;color:#c0392b;}
  .dates{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .dates .od{color:#c0392b;font-weight:700;}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);}
  .btn:disabled{opacity:.5;cursor:default;}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(14,30,50,.5);display:flex;align-items:center;justify-content:center;padding:20px;}
  .sheet{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:22px;}
  .sheet h2{color:var(--navy);font-size:18px;margin-bottom:2px;}
  label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:10px 0 4px;}
  input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;}
  .req{color:#c0392b;}
  .msg{font-size:13px;margin:8px 0;min-height:18px;}
  .empty{color:var(--muted);font-size:14px;padding:20px;text-align:center;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  th,td{text-align:left;padding:10px 12px;font-size:13.5px;border-bottom:1px solid var(--line);}
  th{background:var(--navy);color:#fff;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;}
  .pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--bg);color:var(--muted);}
  .rsn{font-size:11px;color:#c0392b;margin-top:4px;max-width:240px;}
  .foot{font-size:12px;color:var(--muted);margin-top:18px;text-align:center;}
</style></head>
<body>
  <div class="top" style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;">
    <div style="min-width:0;">
      <h1 id="agTitle" style="margin:0;line-height:1.1;">Merchandiser Openings</h1>
      <div class="s" id="who">Loading…</div>
    </div>
    <div style="text-align:right;flex-shrink:0;font-size:12px;opacity:.85;line-height:1.3;white-space:nowrap;">recruiting for<br><b style="font-size:14px;">RCC</b><div style="font-size:10px;opacity:.8;">Roshan Commercial Corp.</div></div>
  </div>
  <div class="wrap">
    <div id="candLinkBox" style="background:#eef4ef;border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:14px;"></div>
    <div class="tabs">
      <div class="tab sel" id="tabDash" onclick="show('dash')">Dashboard</div>
      <div class="tab" id="tabOpen" onclick="show('open')">Open positions</div>
      <div class="tab" id="tabMine" onclick="show('mine')">My candidates</div>
    </div>
    <div id="body"><div class="empty">Loading…</div></div>
    <div class="foot">You only see open positions and your own submitted candidates. Counts are anonymized. — RCC</div>
  </div>
<script>
const FN="https://jtfkpmvievetihhfdmqb.supabase.co/functions/v1/agency";
const token=new URLSearchParams(location.search).get("t")||"";
let DATA={openings:[],my_submissions:[],agency:""}, TAB="dash";
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// --- Pipeline (same stages HR uses inside the portal, in plain words for agencies) ---
const PIPELINE=[
  {k:"APPLIED",l:"Submitted"},
  {k:"SCREENING",l:"Screening"},
  {k:"DOCUMENTS",l:"Documents"},
  {k:"RECRUITER_REVIEW",l:"Interview & review"},
  {k:"HR_SIGNOFF",l:"Final approval"},
  {k:"CONTRACT_SIGNING",l:"Contract"},
  {k:"HIRED",l:"Hired"}
];
const pipeIdx=s=>{ const i=PIPELINE.findIndex(p=>p.k===s); return i<0?0:i; };
const stageLabel=s=>{ if(s==="DRAFT")return"Draft — not sent"; if(s==="REJECTED")return"Not selected"; if(s==="POOLED")return"Kept for future openings"; return (PIPELINE.find(p=>p.k===s)||{}).l||"In process"; };
// Horizontal stepper showing exactly where one candidate sits.
function stepper(status){
  const cur=pipeIdx(status);
  return `<div style="display:flex;align-items:flex-start;margin-top:12px;overflow-x:auto;padding-bottom:2px;">`+
    PIPELINE.map((p,i)=>{
      const done=i<cur, on=i===cur;
      const bg=done||on?"#1c6b3f":"#fff", bd=done||on?"#1c6b3f":"#cdd5de", fg=done||on?"#fff":"#9aa5b1";
      const line=i<PIPELINE.length-1?`<div style="width:20px;height:2px;background:${i<cur?"#1c6b3f":"#e3e8ef"};margin-top:11px;flex-shrink:0;"></div>`:"";
      return `<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:60px;">
          <div style="width:22px;height:22px;border-radius:50%;background:${bg};border:2px solid ${bd};color:${fg};font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;">${done?"✓":i+1}</div>
          <div style="font-size:9.5px;text-align:center;margin-top:5px;color:${on?"#12352a":"#9aa5b1"};font-weight:${on?800:600};line-height:1.15;">${p.l}</div>
        </div>${line}`;
    }).join("")+`</div>`;
}
function dashTile(n,label,col){ return `<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;">
  <div style="font-size:26px;font-weight:800;color:${col};line-height:1;">${n}</div>
  <div style="font-size:12px;color:var(--muted);font-weight:700;margin-top:4px;">${label}</div></div>`; }
function candCard(x){
  const dt=x.submitted?new Date(x.submitted).toLocaleDateString(undefined,{month:"short",day:"numeric"}):"";
  return `<div class="card" style="flex-direction:column;align-items:stretch;gap:0;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;">
      <div style="min-width:0;"><span class="nm">${esc(x.name)}</span> <span class="loc">${x.store?"· "+esc(x.store):""}${x.position?" · "+esc(x.position):""}</span></div>
      <span class="chip open">${esc(stageLabel(x.status))}</span>
    </div>
    ${stepper(x.status)}
    ${dt?`<div class="dates" style="margin-top:8px;">Submitted ${dt}</div>`:""}
  </div>`;
}
function renderDash(b){
  const all=(DATA.my_submissions||[]).filter(x=>!x.hidden);
  const inProc=all.filter(x=>!["DRAFT","HIRED","REJECTED","POOLED"].includes(x.status));
  const pooled=all.filter(x=>x.status==="POOLED");
  const hired=all.filter(x=>x.status==="HIRED");
  const drafts=all.filter(x=>x.status==="DRAFT");
  const rejected=all.filter(x=>x.status==="REJECTED");
  let html=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px;">`
    +dashTile(inProc.length,"In process","#1c6b3f")
    +dashTile(hired.length,"Hired","#2c6e8f")
    +dashTile(drafts.length,"Drafts to send",drafts.length?"#8a6a14":"#6B7785")
    +dashTile(rejected.length,"Not selected","#6B7785")
    +`</div>`;
  if(drafts.length){ html+=`<div style="background:var(--amber-bg);border:1px solid #eadfbe;border-radius:11px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#7a5c10;">
      You have <b>${drafts.length} draft${drafts.length>1?"s":""}</b> not yet sent to RCC. Open <b>My candidates</b> to review and <b>Submit to RCC</b>.</div>`; }
  html+=`<div class="grp">Where your candidates are</div>`;
  if(!inProc.length){ html+=`<div class="empty">No candidates in process right now. Open a position and add a candidate — you'll see their progress here.</div>`; }
  else html+=inProc.map(candCard).join("");
  if(pooled.length){ html+=`<div class="grp">Kept for future openings</div>`
    +pooled.map(x=>`<div class="card"><div style="flex:1;"><span class="nm">${esc(x.name)}</span> <span class="loc">${x.store?"· "+esc(x.store):""}</span></div><span class="chip" style="background:#eef0f5;color:#5a6472;">Talent pool</span></div>`).join(""); }
  if(hired.length){ html+=`<div class="grp">Hired this period (${hired.length})</div>`
    +hired.map(x=>`<div class="card"><div style="flex:1;"><span class="nm">${esc(x.name)}</span> <span class="loc">${x.store?"· "+esc(x.store):""}</span></div><span class="chip hir">${x.still_active===false?"Left — please remove":"Hired ✓"}</span></div>`).join(""); }
  b.innerHTML=html;
}

async function load(){
  if(!token){ document.getElementById("body").innerHTML='<div class="empty">This link is missing its access code. Please use the link RCC gave you.</div>'; document.getElementById("who").textContent="No access"; return; }
  try{
    const r=await fetch(`${FN}?token=${encodeURIComponent(token)}&action=board`);
    const d=await r.json();
    if(d.error){ document.getElementById("body").innerHTML=`<div class="empty">${esc(d.error)}</div>`; document.getElementById("who").textContent="No access"; return; }
    DATA=d;
    const slots=(d.openings||[]).reduce((s,o)=>s+(Number(o.open_slots)||0),0);
    const myActive=(d.my_submissions||[]).filter(x=>!["DRAFT","HIRED","REJECTED"].includes(x.status)).length;
    const at=document.getElementById("agTitle"); if(at) at.innerHTML=`${esc(d.agency||"Agency")} <span style="font-weight:500;opacity:.8;">— Merchandiser Openings</span>`;
    document.getElementById("who").textContent=`${d.openings.length} stores · ${slots} open positions · ${d.total_active||0} candidates in process · ${myActive} from ${d.agency}`;
    const to=document.getElementById("tabOpen"); if(to) to.textContent=`Open positions (${slots})`;
    const tm=document.getElementById("tabMine"); if(tm) tm.textContent=`My candidates (${(d.my_submissions||[]).filter(x=>!x.hidden).length})`;
    render();
  }catch(e){ document.getElementById("body").innerHTML=`<div class="empty">Couldn't load right now. Please try again.</div>`; }
}
function show(t){ TAB=t;
  document.getElementById("tabDash").classList.toggle("sel",t==="dash");
  document.getElementById("tabOpen").classList.toggle("sel",t==="open");
  document.getElementById("tabMine").classList.toggle("sel",t==="mine");
  render(); }
function render(){
  const b=document.getElementById("body");
  if(TAB==="dash"){ renderDash(b); return; }
  if(TAB==="mine"){
    const all=(DATA.my_submissions||[]).filter(x=>!x.hidden);
    if(!all.length){ b.innerHTML=`<div class="empty">No candidates yet. Open a position and click “Submit a candidate” — it saves as a draft you review before sending to RCC.</div>`; return; }
    const drafts=all.filter(x=>x.status==="DRAFT");
    const inProc=all.filter(x=>!["DRAFT","HIRED","REJECTED","POOLED"].includes(x.status));
    const pooled=all.filter(x=>x.status==="POOLED");
    const hired=all.filter(x=>x.status==="HIRED");
    const rejected=all.filter(x=>x.status==="REJECTED");
    const dt=x=>x.submitted?new Date(x.submitted).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—';
    const sech=(t,n,extra)=>`<div style="font-weight:800;font-size:14px;color:#12352a;margin:16px 0 6px;">${t} <span style="background:#e6ecf3;color:#41506b;border-radius:10px;font-size:11px;padding:1px 8px;font-weight:700;">${n}</span>${extra?` <span style="font-weight:400;font-size:12px;color:var(--muted);">${extra}</span>`:''}</div>`;
    const removeBtn=x=>`<button class="btn ghost" style="color:#a12;font-size:12px;padding:4px 10px;" onclick='removeMine(${JSON.stringify(x.id)})'>Remove</button>`;
    const tbl=(list,statusCell)=>`<table><thead><tr><th>Candidate</th><th>Store</th><th>Status</th><th>Submitted</th><th></th></tr></thead><tbody>`+
      list.map(x=>`<tr><td><b>${esc(x.name)}</b><div style="font-size:11.5px;color:var(--muted);">${esc(x.position||"")}</div></td><td>${esc(x.store||"—")}</td><td>${statusCell(x)}${x.status==="REJECTED"&&x.reason?`<div class="rsn">${esc(x.reason)}</div>`:""}</td><td style="white-space:nowrap;font-size:12px;color:var(--muted);">${dt(x)}</td><td style="white-space:nowrap;text-align:right;">${x.status==="HIRED"&&x.still_active===false?removeBtn(x):x.status==="REJECTED"?removeBtn(x):""}</td></tr>`).join("")+
      `</tbody></table>`;
    let html=`<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px;font-size:12.5px;color:var(--muted);">Keep your list tidy — once someone is <b>hired</b> they move to the Hired list below; please <b>remove</b> anyone who has left or wasn't selected.</div>`;
    html+=sech("In process",inProc.length);
    html+= inProc.length? tbl(inProc,x=>`<span class="pill" style="background:var(--green-bg);color:var(--green);">${esc(stageLabel(x.status))}</span>`) : `<div style="font-size:12.5px;color:var(--muted);padding:4px 2px;">None in process.</div>`;
    if(pooled.length){ html+=sech("Kept for future openings",pooled.length)+tbl(pooled,()=>`<span class="pill" style="background:#eef0f5;color:#5a6472;">Talent pool</span>`); }
    html+=sech("Hired",hired.length,"— still with RCC?");
    html+= hired.length? tbl(hired,x=> x.still_active===false?`<span class="pill" style="background:#fdeaea;color:#a4322a;">No longer active — please remove</span>`:x.still_active===true?`<span class="chip hir">Hired · still active ✓</span>`:`<span class="chip hir">Hired</span>`) : `<div style="font-size:12.5px;color:var(--muted);padding:4px 2px;">No hires yet this period.</div>`;
    if(rejected.length){ html+=sech("Not selected — please remove",rejected.length)+tbl(rejected,()=>`<span class="pill" style="background:#f3f3f3;color:#777;">Not selected</span>`); }
    if(drafts.length){ html+=sech("Drafts — not yet sent to RCC",drafts.length)+`<table><thead><tr><th>Candidate</th><th>Store</th><th>Status</th><th></th></tr></thead><tbody>`+
      drafts.map(x=>{ const i=(DATA.my_submissions||[]).indexOf(x); return `<tr><td><b>${esc(x.name)}</b><div style="font-size:11.5px;color:var(--muted);">${esc(x.position||"")}</div></td><td>${esc(x.store||"—")}</td><td><span class="pill" style="background:#fdf6e3;color:#8a6a14;">Draft — not sent</span></td><td style="white-space:nowrap;text-align:right;"><button class="btn ghost" onclick='editDraft(${i})'>Edit</button> <button class="btn" onclick='shipDraft(${i})'>Submit to RCC</button></td></tr>`; }).join("")+`</tbody></table>`; }
    b.innerHTML=html;
    return;
  }
  const ops=DATA.openings||[];
  if(!ops.length){ b.innerHTML='<div class="empty">No open positions right now. Check back soon.</div>'; return; }
  const superOf=a=>(a==="GMA"||a==="NL"||a==="SL")?"Luzon":(a||"Other");
  const REGIONS=[["Luzon","Luzon"],["VIS","Visayas"],["MIN","Mindanao"]];
  const regName=a=>{ const m=REGIONS.find(r=>r[0]===a); return m?m[1]:(a||"Other"); };
  const regIdx=a=>{ const i=REGIONS.findIndex(r=>r[0]===a); return i<0?99:i; };
  const areas=[...new Set(ops.map(o=>superOf(o.area||"—")))].sort((x,y)=>regIdx(x)-regIdx(y));
  const fmtD=s=>{ if(!s) return ""; const d=new Date(s+"T00:00:00"); return isNaN(d)?"":d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); };
  const cardHtml=o=>{
      const s=Number(o.stationary_need||0), r=Number(o.reliever_need||0);
      const needChips=[ s>0?`<span class="chip open">${s} stationary</span>`:"", r>0?`<span class="chip" style="background:#eaf3ff;color:#1f5fa6;">${r} reliever</span>`:"" ].filter(Boolean).join(" ") || `<span class="chip open">${o.open_slots} shortfall</span>`;
      const urgent=o.urgent?`<span class="chip urg">⚡ Urgent</span>`:"";
      const since=o.opening_since?`<div class="loc">Open since ${fmtD(o.opening_since)}</div>`:"";
      return `<div class="card"${o.urgent?' style="border-color:#e6a6a0;background:#fff7f6;"':''}>
      <div style="flex:1;min-width:140px;"><div class="nm">${esc(o.store)} ${urgent}</div>
        <div class="loc">${esc(o.city||"")}${o.category?" · "+(o.category==="CN"?"Concession":"Boutique"):""}</div>${since}</div>
      <div class="chips">
        ${needChips}
        <span class="chip ${o.in_review>0?'rev':'hir'}">${o.in_review} in review${o.my_in_review?` · ${o.my_in_review} ${esc(DATA.agency)}`:""}</span>
        ${o.hired?`<span class="chip hir">${o.hired} hired</span>`:""}
      </div>
      <button class="btn" onclick='openSubmit(${JSON.stringify(o.store)})'>Submit a candidate</button>
    </div>`; };
  b.innerHTML=areas.map(a=>{
      const rows=ops.filter(o=>superOf(o.area||"—")===a);
      const tot=rows.reduce((n,o)=>n+Number(o.open_slots||0),0);
      const urg=rows.filter(o=>o.urgent).length;
      return `<details open style="margin-bottom:6px;"><summary style="cursor:pointer;list-style:none;outline:none;font-weight:800;color:#12352a;padding:8px 0;">${esc(regName(a))} <span style="font-weight:600;color:#6b7785;font-size:13px;">· ${tot} to fill · ${rows.length} store${rows.length===1?'':'s'}${urg?` · <span style="color:#a4322a;">⚡ ${urg} urgent</span>`:""}</span></summary>`
        + rows.map(cardHtml).join("") + `</details>`;
    }).join("");
}
function statusLabel(p){ if(p==="DRAFT") return "Draft — not sent"; if(p==="HIRED") return "Hired"; if(p==="REJECTED") return "Not selected"; return "In process"; }

function openSubmit(store){
  let m=document.getElementById("subModal"); if(!m){ m=document.createElement("div"); m.id="subModal"; document.body.appendChild(m); }
  m.className="modal";
  m.innerHTML=`<div class="sheet">
    <h2>Add a candidate</h2>
    <div style="color:var(--muted);font-size:13px;">For <b>${esc(store)}</b> — saved as a draft you review before sending to RCC.</div>
    <label>Candidate full name <span class="req">*</span></label><input id="s_name">
    <label>Position</label><input id="s_pos" value="Merchandiser">
    <label>Contact number</label><input id="s_contact">
    <label>Email (optional)</label><input id="s_email" type="email">
    <label>Notes (optional)</label><textarea id="s_notes" rows="2"></textarea>
    <div class="msg" id="s_msg"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
      <button class="btn ghost" onclick="document.getElementById('subModal').remove()">Cancel</button>
      <button class="btn" id="s_save">Save as draft</button>
    </div></div>`;
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  document.getElementById("s_save").onclick=async()=>{
    const name=document.getElementById("s_name").value.trim(), msg=document.getElementById("s_msg");
    if(!name){ msg.style.color="#c0392b"; msg.textContent="Candidate name is required."; return; }
    const btn=document.getElementById("s_save"); btn.disabled=true; btn.textContent="Saving…";
    try{
      const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        token, action:"submit", name, store,
        position:document.getElementById("s_pos").value, contact:document.getElementById("s_contact").value, email:document.getElementById("s_email").value, notes:document.getElementById("s_notes").value })});
      const d=await r.json();
      if(!d.ok){ btn.disabled=false; btn.textContent="Save as draft"; msg.style.color="#c0392b"; msg.textContent=d.error||"Couldn't save. Try again."; return; }
      msg.style.color="#1c6b3f"; msg.textContent="✓ Saved as a draft. Review it under “My submissions”, then Submit to RCC.";
      setTimeout(()=>{ m.remove(); TAB="mine"; load(); }, 1500);
    }catch(e){ btn.disabled=false; btn.textContent="Save as draft"; msg.style.color="#c0392b"; msg.textContent="Couldn't save. Try again."; }
  };
}
function shipDraft(i){
  const x=(DATA.my_submissions||[])[i]; if(!x) return;
  if(!confirm("Submit "+x.name+" to RCC? Once submitted it can no longer be edited here.")) return;
  fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,action:"ship",id:x.id})})
    .then(r=>r.json()).then(d=>{ if(!d.ok){ alert(d.error||"Couldn't submit."); return; } load(); })
    .catch(()=>alert("Couldn't submit. Please try again."));
}
function removeMine(id){
  if(!confirm("Remove this person from your list? They stay on RCC's records — this just tidies your view.")) return;
  fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,action:"hide",id,hidden:true})})
    .then(r=>r.json()).then(d=>{ if(!d.ok){ alert(d.error||"Couldn't remove."); return; } load(); })
    .catch(()=>alert("Couldn't remove. Please try again."));
}
function editDraft(i){
  const x=(DATA.my_submissions||[])[i]; if(!x) return;
  let m=document.getElementById("subModal"); if(!m){ m=document.createElement("div"); m.id="subModal"; document.body.appendChild(m); }
  m.className="modal";
  m.innerHTML=`<div class="sheet">
    <h2>Edit candidate</h2>
    <div style="color:var(--muted);font-size:13px;">For <b>${esc(x.store)}</b> — fill in the details, save, then Submit to RCC.</div>
    <label>Candidate full name <span class="req">*</span></label><input id="s_name" value="${esc(x.name||"")}">
    <label>Position</label><input id="s_pos" value="${esc(x.position||"Merchandiser")}">
    <label>Contact number</label><input id="s_contact" value="${esc(x.contact||"")}">
    <label>Email</label><input id="s_email" value="${esc(x.email||"")}">
    <label>Notes (optional)</label><textarea id="s_notes" rows="2">${esc(x.notes||"")}</textarea>
    <div class="msg" id="s_msg"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
      <button class="btn ghost" onclick="document.getElementById('subModal').remove()">Cancel</button>
      <button class="btn" id="s_save">Save draft</button>
    </div></div>`;
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  document.getElementById("s_save").onclick=async()=>{
    const name=document.getElementById("s_name").value.trim(), msg=document.getElementById("s_msg");
    if(!name){ msg.style.color="#c0392b"; msg.textContent="Candidate name is required."; return; }
    const btn=document.getElementById("s_save"); btn.disabled=true; btn.textContent="Saving…";
    try{
      const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        token, action:"update", id:x.id, name, position:document.getElementById("s_pos").value,
        contact:document.getElementById("s_contact").value, email:document.getElementById("s_email").value, notes:document.getElementById("s_notes").value })});
      const d=await r.json();
      if(!d.ok){ btn.disabled=false; btn.textContent="Save draft"; msg.style.color="#c0392b"; msg.textContent=d.error||"Couldn't save."; return; }
      msg.style.color="#1c6b3f"; msg.textContent="✓ Saved.";
      setTimeout(()=>{ m.remove(); load(); }, 800);
    }catch(e){ btn.disabled=false; btn.textContent="Save draft"; msg.style.color="#c0392b"; msg.textContent="Couldn't save. Try again."; }
  };
}
load();
(function(){ const cb=document.getElementById("candLinkBox"); if(!cb||!token){ if(cb) cb.style.display="none"; return; }
  const link="https://agenovi.github.io/rcc-hris-portal/direct-apply.html?ag="+encodeURIComponent(token);
  cb.innerHTML=`<div style="font-weight:800;color:var(--navy);font-size:13.5px;margin-bottom:2px;">📩 Candidate application link</div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">Share this with your candidates so they fill in the full application <b>themselves</b> — it lands in <b>My submissions</b> as a draft for you to review, then Submit to RCC.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" id="copyCand" style="width:auto;padding:10px 20px;">📩 APPLICATION — Copy link</button>
      <a class="btn" href="${esc(link)}" target="_blank" rel="noopener" style="width:auto;padding:10px 18px;background:#fff;color:var(--navy);border:1px solid #cdd5de;text-decoration:none;">Preview</a>
    </div>`;
  const cc=document.getElementById("copyCand"); if(cc) cc.onclick=()=>{ if(navigator.clipboard) navigator.clipboard.writeText(link); cc.textContent="✓ Copied — share with your candidate"; setTimeout(()=>cc.textContent="📩 APPLICATION — Copy link",1600); };
})();
</script></body></html>
